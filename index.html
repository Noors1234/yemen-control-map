<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yemen Control Map</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --card: #1f2937;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --gov: #22c55e;
        --houthi: #f59e0b;
        --terror: #ef4444;
        --neutral: #64748b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(180deg, #020817 0%, #111827 100%);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 20px 60px;
      }

      header { padding: 18px 0 28px; }

      h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        margin: 0 0 10px;
      }

      .subtitle {
        color: var(--muted);
        margin: 0;
        line-height: 1.6;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin: 28px 0 32px;
      }

      .stat {
        background: rgba(17, 24, 39, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 14px;
        padding: 18px;
      }

      .stat-label {
        color: var(--muted);
        font-size: 0.82rem;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .stat-value {
        font-size: clamp(1.6rem, 4vw, 2.2rem);
        margin-top: 10px;
        font-weight: 700;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 18px;
        align-items: center;
        margin: 18px 0 24px;
        color: var(--muted);
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
      }

      .area-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .area-card {
        background: rgba(31, 41, 55, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 14px;
        overflow: hidden;
      }

      .area-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 16px 16px 12px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.12);
      }

      .area-name { font-weight: 700; }

      .badge {
        color: white;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .area-body {
        padding: 14px 16px 16px;
        color: var(--muted);
        line-height: 1.6;
      }

      .meta {
        display: grid;
        gap: 4px;
        margin-top: 10px;
      }

      .meta strong { color: var(--text); }

      .footer-note {
        margin-top: 36px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (max-width: 640px) {
        .container { padding-top: 20px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Yemen Control Map</h1>
        <p class="subtitle">
          A lightweight dashboard tracking territorial control and conflict conditions across Yemen.
        </p>
      </header>

      <section class="stats" id="stats"></section>
      <div class="legend" id="legend"></div>
      <section class="area-list" id="areas"></section>

      <p class="footer-note">
        Source data is loaded from <code>yemen-control-state.json</code> and can be updated without changing the page layout.
      </p>
    </div>

    <script>
      const palette = {
        government: '#22c55e',
        houthi: '#f59e0b',
        terrorist: '#ef4444',
        neutral: '#64748b'
      };

      const legend = document.getElementById('legend');
      const statsEl = document.getElementById('stats');
      const areasEl = document.getElementById('areas');

      function formatEntity(value) {
        return value.charAt(0).toUpperCase() + value.slice(1);
      }

      function renderLegend() {
        legend.innerHTML = Object.entries(palette).map(([key, color]) => `
          <span class="legend-item"><span class="dot" style="background:${color}"></span>${formatEntity(key)}</span>
        `).join('');
      }

      function renderStats(data) {
        const { summary } = data;
        const items = [
          ['Government-controlled', summary.government],
          ['Houthi-controlled', summary.houthi],
          ['Terrorist-affected', summary.terrorist],
          ['Neutral / disputed', summary.neutral]
        ];

        statsEl.innerHTML = items.map(([label, value]) => `
          <div class="stat">
            <div class="stat-label">${label}</div>
            <div class="stat-value">${value}</div>
          </div>
        `).join('');
      }

      function renderAreas(data) {
        areasEl.innerHTML = data.areas.map(area => {
          const color = palette[area.control];
          return `
            <article class="area-card">
              <div class="area-header">
                <span class="area-name">${area.name}</span>
                <span class="badge" style="background:${color}">${area.control}</span>
              </div>
              <div class="area-body">
                <div>${area.summary}</div>
                <div class="meta">
                  <div><strong>Population:</strong> ${area.population}</div>
                  <div><strong>Last update:</strong> ${area.lastUpdated}</div>
                </div>
              </div>
            </article>
          `;
        }).join('');
      }

      fetch('yemen-control-state.json')
        .then(response => {
          if (!response.ok) throw new Error('Unable to load the map data file.');
          return response.json();
        })
        .then(data => {
          renderLegend();
          renderStats(data);
          renderAreas(data);
        })
        .catch(error => {
          statsEl.innerHTML = `
            <div class="stat" style="grid-column: 1 / -1;">
              <div class="stat-label">Data loading issue</div>
              <div class="stat-value" style="font-size: 1.1rem;">${error.message}</div>
            </div>
          `;
          console.error(error);
        });
    </script>
  </body>
</html>
